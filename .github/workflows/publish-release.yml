name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing tag to publish as a release (for example, v0.3.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create release from bilingual changelogs
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PUSHED_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          else
            tag="$PUSHED_TAG"
          fi

          if [[ "$tag" != v* ]]; then
            echo "Expected a version tag starting with 'v'; got: $tag" >&2
            exit 1
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "A GitHub Release for $tag already exists; nothing to do."
            exit 0
          fi

          version="${tag#v}"

          extract_section() {
            local file="$1"
            awk -v target="## $version" '
              !found && ($0 == target || index($0, target " -") == 1) {
                found = 1
                next
              }
              found && /^## / { exit }
              found { print }
            ' "$file" | sed '1{/^[[:space:]]*$/d;}'
          }

          english_notes="$(extract_section CHANGELOG.md)"
          chinese_notes="$(extract_section CHANGELOG.zh.md)"

          if [[ -z "$(printf '%s' "$english_notes" | tr -d '[:space:]')" ]]; then
            echo "No CHANGELOG.md section found for version $version" >&2
            exit 1
          fi

          if [[ -z "$(printf '%s' "$chinese_notes" | tr -d '[:space:]')" ]]; then
            echo "No CHANGELOG.zh.md section found for version $version" >&2
            exit 1
          fi

          notes_file="$RUNNER_TEMP/release-notes.md"
          {
            printf '## English\n\n%s\n' "$english_notes"
            printf '\n## 中文\n\n%s\n' "$chinese_notes"
          } > "$notes_file"

          gh release create "$tag" \
            --verify-tag \
            --title "$tag" \
            --notes-file "$notes_file"
